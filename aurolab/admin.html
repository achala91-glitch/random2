<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurolab Sales Assistant · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#006380;--teal-d:#004C63;--teal-l:#1B88A3;
  --ink:#16343B;--muted:#5B7076;--faint:#93A5AA;--line:#E2EBED;
  --paper:#F1F6F7;--surface:#FFFFFF;--chip:#EEF5F6;
  --cataract:#1D753B;--retina:#BF3061;--cornea:#F47535;--glaucoma:#653E95;--orbit:#8FC73F;--general:#EDC337;
  --disp:'Poppins',sans-serif;--body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:var(--body);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--disp);margin:0;}
.hidden{display:none !important;}
.logo{display:inline-flex;align-items:center;gap:9px;}
.logo svg{width:24px;height:24px;}
.logo .wm{font-family:var(--disp);font-weight:700;letter-spacing:.06em;font-size:18px;}

/* sign in */
.si-title{font-family:var(--disp);font-weight:600;font-size:18px;color:var(--ink);margin-top:14px;}
.si-err{color:var(--retina);background:#FBEEF2;font-size:13px;line-height:1.4;border-radius:9px;padding:9px 12px;margin:0 0 14px;}
#signin{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%,#CFE8EC,var(--paper) 55%,#F6FBFC);}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;max-width:400px;width:100%;padding:34px 30px;box-shadow:0 24px 60px rgba(0,60,80,.12);}
.card .logo{color:var(--teal);} .card .logo .wm{font-size:23px;}
.badge-admin{display:inline-block;margin:12px 0 4px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-d);background:var(--chip);padding:4px 10px;border-radius:7px;}
.tag{color:var(--muted);font-size:13px;margin:8px 0 24px;}
.field{margin-bottom:14px;}.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.field input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:15px;background:#FBFDFD;}
.field input:focus{outline:none;border-color:var(--teal);}
.btn-primary{width:100%;background:var(--teal);color:#fff;font-weight:600;font-size:15px;padding:13px;border-radius:11px;transition:transform .1s,box-shadow .15s;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,99,128,.28);}

/* shell */
#app{display:none;height:100%;}
.layout{display:flex;height:100%;}
.side{width:230px;background:var(--teal-d);color:#fff;display:flex;flex-direction:column;flex-shrink:0;}
.side .brand{padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,.12);}
.side .brand .logo{color:#fff;}
.side .brand .sub{font-family:var(--body);font-size:11px;color:#9EC6CF;margin-top:4px;letter-spacing:.02em;}
.nav{flex:1;padding:14px 12px;}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:10px;color:#CFE4E9;font-size:14.5px;font-weight:500;margin-bottom:4px;transition:all .14s;}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav button.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600;}
.side .foot{padding:14px 12px;border-top:1px solid rgba(255,255,255,.12);}
.side .foot button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:10px;color:#CFE4E9;font-size:14px;}
.side .foot button:hover{background:rgba(255,255,255,.08);color:#fff;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0;}
.topbar h1{font-size:19px;color:var(--ink);}
.topbar .who{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);}
.topbar .av{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:600;font-size:13px;}
.content{flex:1;overflow-y:auto;padding:26px 28px;}

/* dashboard */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
.stat .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;font-weight:500;}
.stat .v{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--ink);margin-top:8px;}
.stat .d{font-size:12px;color:var(--faint);margin-top:3px;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#28C76F;animation:pl 1.4s infinite;}
@keyframes pl{0%,100%{opacity:1;}50%{opacity:.4;}}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px;}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
.panel h3{font-size:15px;color:var(--teal-d);margin-bottom:14px;}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;}
.bar{flex:1;background:linear-gradient(var(--teal-l),var(--teal));border-radius:5px 5px 0 0;min-height:4px;position:relative;transition:height .4s;}
.bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:9px;color:var(--faint);}
.toplist .row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.toplist .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.toplist .nm{font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.toplist .track{width:140px;flex-shrink:0;height:7px;background:var(--chip);border-radius:7px;overflow:hidden;}
.toplist .fill{display:block;height:100%;border-radius:7px;transition:width .5s ease;}
.toplist .ct{font-size:12px;color:var(--muted);width:34px;text-align:right;font-variant-numeric:tabular-nums;}
.gap-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.gap-row .q{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gap-row button{font-size:12px;font-weight:600;color:var(--teal);background:var(--chip);padding:5px 11px;border-radius:8px;white-space:nowrap;}
.gap-row button:hover{background:var(--teal);color:#fff;}

/* table */
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:13px 18px;background:#F7FBFB;border-bottom:1px solid var(--line);font-weight:600;}
td{padding:14px 18px;font-size:14px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
.pillr{display:inline-block;font-size:11px;padding:3px 9px;border-radius:7px;background:var(--chip);color:var(--teal-d);font-weight:600;}
.pillr.off{background:#FBEAE6;color:var(--retina);}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sec-head h2{font-size:17px;}
.add-btn{display:inline-flex;align-items:center;gap:7px;background:var(--teal);color:#fff;font-weight:600;font-size:13.5px;padding:10px 15px;border-radius:10px;}
.add-btn:hover{box-shadow:0 8px 20px rgba(0,99,128,.25);}

/* content tab */
.ctab{display:grid;grid-template-columns:300px 1fr;gap:18px;height:100%;}
.tree{background:#fff;border:1px solid var(--line);border-radius:14px;overflow-y:auto;padding:10px;}
.tree input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:8px;}
.div-h{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--teal-d);padding:10px 8px 5px;}
.spec-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:7px 8px 3px;display:flex;align-items:center;gap:6px;font-weight:600;}
.spec-h .d{width:8px;height:8px;border-radius:50%;}
.pitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink);}
.pitem:hover{background:var(--chip);}
.pitem.active{background:var(--chip);font-weight:600;}
.pitem .pd{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.editor{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;overflow-y:auto;}
.ed-cat{display:inline-block;font-size:11px;color:#fff;padding:3px 10px;border-radius:7px;font-weight:600;margin-bottom:8px;}
.editor h2{font-size:20px;margin-bottom:4px;}
.editor .tl{color:var(--muted);font-size:13.5px;margin-bottom:18px;}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.ed-field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.ed-field input,.ed-field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;color:var(--ink);}
.ed-field textarea{resize:vertical;min-height:70px;line-height:1.5;}
.ed-field.full{grid-column:1/3;}
.reindex{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--teal);background:var(--chip);padding:8px 13px;border-radius:9px;margin-top:4px;}
.subh{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--teal-d);margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
.q-item{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;}
.q-item .qq{font-size:13.5px;font-weight:500;}
.q-item .qa{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
.q-item .qa.rag{color:var(--teal-l);font-style:italic;}
.q-tools{display:flex;gap:6px;margin-top:8px;}
.q-tools button{font-size:11.5px;color:var(--muted);background:var(--chip);padding:4px 9px;border-radius:7px;}
.q-tools button:hover{color:var(--teal);}
.broc-box{display:flex;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-bottom:6px;}
.broc-box .bl{font-size:13px;color:var(--muted);}
.up-btn{font-size:12.5px;font-weight:600;color:var(--teal);background:var(--chip);padding:7px 13px;border-radius:9px;}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,40,50,.45);display:none;align-items:center;justify-content:center;z-index:60;}
.modal.show{display:flex;}
.modal .box{background:#fff;border-radius:16px;padding:24px;width:420px;max-width:92vw;}
.modal h3{font-size:17px;margin-bottom:16px;color:var(--teal-d);}
@media(max-width:1000px){.stat-row{grid-template-columns:repeat(2,1fr);}.grid2{grid-template-columns:1fr;}.ctab{grid-template-columns:1fr;height:auto;}.ed-grid{grid-template-columns:1fr;}.ed-field.full{grid-column:1;}}

/* ---------- dashboard loading ---------- */
.dash-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.dash-head .upd{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;}
.dash-head .upd i{width:7px;height:7px;border-radius:50%;background:var(--faint);}
.dash-head .upd.ok i{background:#28C76F;}
.refresh{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--teal);background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:9px;transition:all .14s;}
.refresh:hover:not(:disabled){background:var(--teal);border-color:var(--teal);color:#fff;}
.refresh:disabled{cursor:default;color:var(--muted);}
.refresh.busy svg{animation:spin .8s linear infinite;}
.ld-slot.sv:not(.in){min-height:72px;}
.ld-slot.pc:not(.in){min-height:166px;}
.ld-slot.pt:not(.in){min-height:166px;}
.ld-slot.pg:not(.in){min-height:150px;}
.ld{display:flex;align-items:center;justify-content:center;min-height:inherit;}
.ld-spin{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--chip);border-top-color:var(--teal);animation:spin .75s linear infinite;}
.ld-slot.sv .ld-spin{width:20px;height:20px;}
.ld-slot.in>*{animation:ldIn .4s ease both;}
.bar.grow{animation:grow .6s cubic-bezier(.2,.8,.2,1) both;}
@keyframes ldIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
@keyframes grow{from{height:0;}}

/* ---------- loading screen ---------- */
.boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  background:radial-gradient(900px 520px at 50% 38%,#0B7A99 0%,#006380 48%,#004C63 100%);transition:opacity .38s ease;}
.boot.out{opacity:0;pointer-events:none;}
.boot.gone{display:none;}
.boot-in{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;}
.boot-mark{width:74px;height:74px;animation:bootIn .6s cubic-bezier(.2,.8,.2,1) both;}
.boot-mark svg{width:100%;height:100%;display:block;overflow:visible;}
.boot-eye{transform-box:fill-box;transform-origin:center;animation:bootEye 1.6s ease-in-out infinite;}
.boot-ring{transform-box:fill-box;transform-origin:center;fill:none;stroke:#fff;stroke-width:1.4;opacity:0;animation:bootRing 1.6s ease-out infinite;}
.boot-wm{font-family:var(--disp);font-weight:700;letter-spacing:.14em;font-size:22px;margin-top:18px;animation:bootIn .6s .08s cubic-bezier(.2,.8,.2,1) both;}
.boot-sub{font-size:12.5px;letter-spacing:.06em;color:#BFE0E7;margin-top:5px;animation:bootIn .6s .14s cubic-bezier(.2,.8,.2,1) both;}
.boot-bar{width:184px;height:3px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:30px;overflow:hidden;animation:bootIn .6s .2s both;}
.boot-bar i{display:block;height:100%;width:0;border-radius:3px;background:#fff;transition:width .45s cubic-bezier(.4,0,.2,1);}
.boot-msg{font-size:12.5px;color:#D5ECF1;margin-top:13px;min-height:18px;transition:opacity .2s;}
.boot.quick .boot-bar,.boot.quick .boot-msg{visibility:hidden;}
.boot-foot{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;letter-spacing:.04em;color:rgba(255,255,255,.55);}
@keyframes bootIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes bootEye{0%,100%{transform:scale(1);}50%{transform:scale(.82);}}
@keyframes bootRing{0%{opacity:.7;transform:scale(1);}100%{opacity:0;transform:scale(2.3);}}
.btn-primary.loading{opacity:.85;cursor:default;transform:none;box-shadow:none;}
.btn-primary .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:-3px;margin-right:9px;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(prefers-reduced-motion:reduce){.boot-eye,.boot-ring,.boot-mark,.boot-wm,.boot-sub,.boot-bar{animation:none;}}
</style>
</head>
<body>

<!-- ============ LOADING SCREEN ============ -->
<div id="boot" class="boot quick" role="status" aria-live="polite">
  <div class="boot-in">
    <div class="boot-mark"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5 L45 44 L35.5 44 L24 22 L12.5 44 L3 44 Z" fill="currentColor"/><circle class="boot-ring" cx="24" cy="34.5" r="6.4"/><circle class="boot-eye" cx="24" cy="34.5" r="6.4" fill="currentColor"/></svg></div>
    <div class="boot-wm">AUROLAB</div>
    <div class="boot-sub">Sales Assistant · Admin</div>
    <div class="boot-bar"><i id="bootFill"></i></div>
    <div class="boot-msg" id="bootMsg"></div>
  </div>
  <div class="boot-foot">Ophthalmic Intelligence. Trusted Worldwide.</div>
</div>

<div id="signin">
  <div class="card">
    <div class="logo"><svg viewBox="0 0 48 48"><path d="M24 5 L45 44 L35.5 44 L24 22 L12.5 44 L3 44 Z" fill="currentColor"/><circle cx="24" cy="34.5" r="6.4" fill="currentColor"/></svg><span class="wm">AUROLAB</span></div>
    <div class="si-title">Aurolab Sales Assistant</div>
    <div class="badge-admin">Admin Console</div>
    <div class="tag">Ophthalmic Intelligence. Trusted Worldwide.</div>
    <div class="field"><label for="si-email">Admin email</label><input id="si-email" type="email" placeholder="you@example.com" autocomplete="username" autocapitalize="off" spellcheck="false" value="" onkeydown="if(event.key==='Enter')$('#si-pass').focus()"></div>
    <div class="field"><label for="si-pass">Password</label><input id="si-pass" type="password" placeholder="••••••••" autocomplete="current-password" value="" onkeydown="if(event.key==='Enter')signIn()"></div>
    <div class="si-err hidden" id="si-err" role="alert"></div>
    <button class="btn-primary" id="si-btn" onclick="signIn()">Sign in</button>
  </div>
</div>

<div id="app">
  <div class="layout">
    <aside class="side">
      <div class="brand"><div class="logo"><svg viewBox="0 0 48 48"><path d="M24 5 L45 44 L35.5 44 L24 22 L12.5 44 L3 44 Z" fill="currentColor"/><circle cx="24" cy="34.5" r="6.4" fill="currentColor"/></svg><span class="wm">AUROLAB</span></div><div class="sub">Sales Assistant · Admin</div></div>
      <nav class="nav">
        <button class="active" data-tab="dash" onclick="go('dash')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</button>
        <button data-tab="users" onclick="go('users')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Users</button>
        <button data-tab="content" onclick="go('content')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Content</button>
      </nav>
      <div class="foot"><button onclick="signOut()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</button></div>
    </aside>
    <div class="main">
      <div class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="who"><span id="whoName">Admin</span><span class="av" id="whoAv">A</span></div></div>
      <div class="content" id="view"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal"><div class="box">
  <h3>Add a sales rep</h3>
  <div class="field"><label>Full name</label><input id="r-name" placeholder="e.g. Karthik Rao"></div>
  <div class="field"><label>Work email</label><input id="r-email" placeholder="name@aurolab.com"></div>
  <div class="field"><label>Region</label><input id="r-region" placeholder="e.g. Karnataka"></div>
  <div style="display:flex;gap:10px;margin-top:8px">
    <button class="pillr" style="padding:11px 16px" onclick="closeModal()">Cancel</button>
    <button class="btn-primary" style="flex:1" onclick="addRep()">Send invite</button>
  </div>
</div></div>

<script>
const DEMO_EMAIL = "test@aurolab.com";     // same login for rep app and admin

function statsData(){
  const s=JSON.parse(localStorage.getItem('al_stats')||'{}');
  const days=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*864e5);const k=d.toISOString().slice(0,10);
    let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))%997;
    const seed=38+Math.round(26*Math.sin(i*0.9)+h%10);days.push({k,label:d.toLocaleDateString('en-IN',{day:'numeric'}),v:(s[k]||0)+Math.max(12,seed)});}
  return days;
}

   <div class="ed-grid">
     <div class="ed-field"><label>Composition / type</label><input value="${esc(p.subName||'')}"></div>
     <div class="ed-field"><label>Price (INR)</label><input value="${esc(p.priceDisplay)}"></div>
     <div class="ed-field full"><label>Description</label><textarea>${esc(p.description||'')}</textarea></div>
     <div class="ed-field full"><label>Highlights</label><textarea>${esc((p.highlights||[]).join('\n'))}</textarea></div>
   </div>
   <div class="subh">Brochure</div>
   <div class="broc-box"><span class="bl">${esc(p.brochure)}</span><button class="up-btn" onclick="alert('Upload a PDF to replace this brochure.')">Upload / replace</button></div>
   <div class="subh">Question bank <span style="font-weight:500;color:var(--faint);font-size:12px">· ${qs.length} questions</span><button class="up-btn" onclick="alert('Add a new question and answer for this product.')">+ Add question</button></div>
   ${qs.map(q=>`<div class="q-item"><div class="qq">${esc(q.q)}</div>${q.a?`<div class="qa">${esc(q.a)}</div>`:`<div class="qa rag">Answered live from product content</div>`}<div class="q-tools"><button>Edit</button><button>Remove</button></div></div>`).join('')}
   <div style="margin-top:16px"><span class="reindex" onclick="reindex(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>Save &amp; re-index</span></div>`;
}
function reindex(el){el.innerHTML='Re-indexing…';setTimeout(()=>{el.innerHTML='&#10003; Live';el.style.color='#2E9E6B';},1300);}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function titleCase(s){return s.replace(/\b\w/g,c=>c.toUpperCase());}

/* ---------------- loading screen ---------------- */
const BOOT_STEPS=()=>[['Verifying admin access',420],['Loading field activity',520],[`Syncing content library · ${KB.products.length} products`,560],['Preparing your dashboard',420]];
const BOOT_FAST=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let booting=false;
/* steps: [[message, ms], ...]; ready() renders the screen underneath before the fade */
function runBoot(steps,ready){
  const b=$('#boot'),fill=$('#bootFill'),msg=$('#bootMsg');
  booting=true;b.classList.remove('gone','out','quick');fill.style.width='0%';msg.textContent='';
  let i=0;
  const next=()=>{
    if(i<steps.length){const [t,ms]=steps[i++];msg.textContent=t;fill.style.width=Math.round(i/steps.length*100)+'%';setTimeout(next,BOOT_FAST?ms*.3:ms);return;}
    try{ready&&ready();}finally{hideBoot();}
  };
  requestAnimationFrame(next);
}
function hideBoot(){const b=$('#boot');b.classList.add('out');setTimeout(()=>{b.classList.add('gone');booting=false;},400);}
if(ADMIN)runBoot(BOOT_STEPS(),boot);
else setTimeout(hideBoot,BOOT_FAST?150:700);
</script>
</body>
</html>
